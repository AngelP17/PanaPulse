[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panapulse-usgs"
version = "0.1.0"
description = "USGS seismic ingestion prototype for PanaPulse"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "anthropic>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["panapulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
