name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test tools
        run: python -m pip install -e '.[test]'
        working-directory: backend
      - name: Run offline tests
        run: python -m pytest tests -q
        working-directory: backend
  mobile-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: React Native TypeScript check
        run: node --stack-size=8000 node_modules/typescript/bin/tsc --noEmit
