name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test tools
        run: python -m pip install -e '.[test]'
        working-directory: backend
      - name: Run offline tests
        run: python -m pytest tests -q
        working-directory: backend
      - name: Validate real-source pilot script
        run: bash -n scripts/first-live-test.sh
  mobile-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: React Native TypeScript check
        run: node --stack-size=8000 node_modules/typescript/bin/tsc --noEmit
      - name: Source precedence regression
        run: node scripts/test-source-policy.cjs
      - name: Seismic UI filtering and catalog integrity
        run: node scripts/test-seismic-view.cjs
      - name: Interactive preview regression
        run: node scripts/test-preview-flow.cjs

      - name: APK build profile checks
        run: node scripts/test-build-env.cjs
